<!doctype html>

<style>
:root{--navy:#14305a;--navy2:#1d4377;--bg:#f3f5f9;--card:#fff;--line:#d9dee7;--line2:#eceff4;--txt:#1b2433;--sub:#6a7587;--blue:#2563eb;--red:#c0392b;--green:#1f9d55;--amber:#d98e04;--sel:#e8f0fe}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;color:var(--txt);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
#app{min-height:100%;display:flex;flex-direction:column}
.top{background:var(--navy);color:#fff;padding:8px 16px;display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;position:sticky;top:0;z-index:20}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.top .meta{font-size:11.5px;opacity:.8;flex:1 1 260px;min-width:0}
.top .btn{white-space:nowrap}
.top .sp{display:none}
.tag{white-space:nowrap;display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.tag.edit{background:#ffd166;color:#4a3500}.tag.view{background:#cfe3ff;color:#0b2e63}
.tabs{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 12px;position:sticky;top:46px;z-index:19;align-items:center}
.tab{padding:12px 20px;border:0;background:none;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent;font-size:15px}
.tab.on{color:var(--navy);border-bottom-color:var(--navy)}
.tabs .sp{flex:1}
.search{padding:7px 12px;border:1px solid var(--line);border-radius:8px;width:260px;background:#f7f9fc}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:#f0f4fa}.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.warn{background:#fff4d6;border-color:#f0c35c}
.top .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff;padding:6px 10px}
.top .btn:hover{background:rgba(255,255,255,.22)}
.top .btn.dirty{background:#ffd166;color:#4a3500;border-color:#ffd166}
main{padding:14px 16px 40px;flex:1}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.kpi .l{font-size:12px;color:var(--sub)}.kpi .v{font-size:22px;font-weight:700;margin-top:2px}.kpi .s{font-size:12px;color:var(--sub)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.panel h2{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.panel h2 small{font-weight:400;color:var(--sub);font-size:12px}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:right;white-space:nowrap}
th{background:#eef2f8;font-weight:700;text-align:center;color:#26344d}
td.l,th.l{text-align:left}
td.c{text-align:center}
tr.team td{background:#f3f6fb;font-weight:700}
tr.tot td{background:#e4ebf7;font-weight:800}
tr.grp td:first-child{padding-left:26px}
td.neg,.neg{color:var(--red)}
td.fc{background:#fff8e6}
.tg{cursor:pointer;user-select:none}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
.note{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}
.pill{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;font-weight:700}
.pill.w{background:#ffe9e6;color:var(--red)}.pill.o{background:#e3f6ea;color:var(--green)}.pill.n{background:#eef2f8;color:var(--sub)}
.fbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.fbar select,.fbar input[type=text]{padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:#fff}
.tbl-wrap{overflow:auto;max-height:calc(100vh - 220px);border:1px solid var(--line);border-radius:8px;background:#fff}
.tbl-wrap table th{position:sticky;top:0;z-index:2}
.tbl-wrap td,.tbl-wrap th{font-size:12.5px;padding:4px 4px}
.cell{width:100%;border:1px solid transparent;background:transparent;padding:3px 4px;border-radius:5px}
.cell:hover,.cell:focus{border-color:#9db7e8;background:#fff;outline:none}
input.cell[type=number]{text-align:right;width:64px}
td select.cell{padding:3px 2px}
.sm12 td,.sm12 th{font-size:12px;padding:4px 5px}
td.nm{min-width:190px;text-align:left}
td.nt{min-width:170px;text-align:left;white-space:normal}
tr.del td{opacity:.45;text-decoration:line-through}
tr.carry td{background:#fafafa;color:#7b8494}
.star{color:#e0a100;font-weight:700}
.rsk{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:9px;background:#fde8e1;color:#b83b0a;font-size:11px;font-weight:700;white-space:nowrap;vertical-align:1px}
.kc.go{cursor:pointer}.kc.go:hover{border-color:#9db3d6}
.kc.rk{border-color:#f1c2b1;background:#fffaf7;cursor:pointer}
.pj{display:grid;grid-template-columns:400px 1fr;gap:12px;align-items:start}
.pjl{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 150px)}
.pji{padding:10px 12px;border-bottom:1px solid var(--line2);cursor:pointer;display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:start}
.pji:hover{background:#f6f9fe}.pji.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--blue)}
.pji .n{font-weight:700;line-height:1.3}.pji .m{font-size:12px;color:var(--sub);margin-top:2px}.pji .sm{font-size:12px;margin-top:4px;color:#3b4658;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pji .amt{text-align:right;font-size:12px;white-space:nowrap}.pji .amt b{font-size:14px}
.dot{width:12px;height:12px;border-radius:50%;margin-top:3px;background:#cfd5df;display:inline-block}
.dot.G{background:var(--green)}.dot.Y{background:var(--amber)}.dot.R{background:var(--red)}.dot.s{background:transparent;border:2px solid var(--amber)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;max-height:calc(100vh - 150px);overflow:auto}
.card h2{margin:0;font-size:19px}
.card .hd{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.card h3{font-size:14px;margin:16px 0 6px;color:var(--navy)}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.kv div{background:#f6f8fc;border:1px solid var(--line2);border-radius:8px;padding:8px 10px}.kv .l{font-size:11px;color:var(--sub)}.kv .v{font-size:17px;font-weight:700}
.ov{white-space:pre-wrap;line-height:1.55;background:#fbfcfe;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;min-height:44px}
textarea.cell{border-color:var(--line);min-height:70px;resize:vertical;line-height:1.5}
.log td{text-align:left;white-space:normal;vertical-align:top;font-size:13px}
.src{font-size:11px;color:var(--sub)}
.sg{display:flex;gap:4px;align-items:center}
.sgb{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;cursor:pointer;font-size:12px;font-weight:700}

function fmt(n,z){if(n==null||isNaN(n))return '';const r=r1(n);if(r===0)return z===undefined?'-':z;const a=Math.abs(r);const s=a.toLocaleString('ko-KR',{minimumFractionDigits:0,maximumFractionDigits:a>=100?0:1});return r<0?'△'+s:s}

 for(const t of D.structure){if(S.pteam&&S.pteam!==t.team)continue;const cards=progSorted().filter(p=>p.team===t.team&&(!S.pmon||p.month===S.pmon)&&(!S.prsk||p.rsk)&&cardMatch(p,q));const dcs=(S.pmon||S.prsk)?[]:deferList(t.team).filter(p=>cardMatch(p,q));if(!cards.length&&!dcs.length)continue;shown+=cards.length+dcs.length;const sum=cards.reduce((a,p)=>a+amtNum(p),0);
  h+=`<h3 class="th">${esc(t.team)} <small>${cards.length}건 · 금액 합 ${f1(sum)}억${dcs.length?` · 27년 연기 ${dcs.length}건(합계 제외)`:''}</small></h3><div class="tbl-wrap" style="max-height:none"><table class="prog"><thead><tr><th style="width:34px">No</th><th style="width:210px">프로젝트</th><th style="width:60px">수주월</th><th style="width:66px">금액(億)</th><th style="width:96px">입찰/수의</th><th style="width:185px">고객사 일정</th><th style="width:130px">심의 일정<br><small style="font-weight:400">(${esc(fmtD(D.meta.csvAsof||''))} 기준)</small></th><th style="width:200px">리스크 포인트</th><th style="width:20%">${hd[0]}</th><th style="width:20%">${hd[1]}</th><th style="width:56px">출력<br><input type="checkbox" data-pall="1" title="화면에 보이는 프로젝트 전체 선택/해제" ${cards.every(printOn)?'checked':''}></th></tr></thead><tbody>`;
  for(const p of [...cards,...dcs]){const isD=dcs.includes(p);if(isD&&p===dcs[0])h+=`<tr class="dfh"><td colspan="11">▼ 27년 연기 건 <span class="src">· 11/23 속보 T/A에서 제외 · 금액은 합계에 미포함</span></td></tr>`;const e=entryUpTo(p.key,S.pdate);const old=e&&e.date!==S.pdate;const pr=priorEntry(p.key,e,S.pdate);

  h+='</tbody></table></div>'}

 return h+`<div class="note">※ 전주 = 직전 기준일의 추진경과, 금주 = 선택한 기준일의 추진경과입니다. 리스크 포인트는 프로젝트 카드 내용입니다. 27년 연기 건은 T/A에서 빠져 금액·합계에 포함하지 않고 별도 구분으로 보여줍니다. 수주전략·기타사항 등 상세 내용은 프로젝트 카드에서 봅니다. 프로젝트명을 누르면 카드로 이동합니다. <b>출력</b> 열에 체크한 프로젝트만 [엑셀 다운로드]의 진행경과 시트에 포함됩니다(기본: 전체 프로젝트). ${RO?'':'내용을 고치면 선택한 기준일로 저장되고, 새 기준일을 추가하면 매주 이어서 작성할 수 있습니다.'}</div></div>`}

 for(const t of D.structure){const cs=progSorted().filter(p=>p.team===t.team&&cardMatch(p,q));if(!cs.length)continue;

 return h||'<div class="empty">없음</div>'}
function viewCard(){if(!S.sel||!D.pjt.find(p=>p.key===S.sel))S.sel=(progSorted()[0]||{}).key||null;

 const dates=logDates();if(!S.pdate)S.pdate=dates[0];const e=entryUpTo(p.key,S.pdate);const old=e&&e.date!==S.pdate;

  <div style="text-align:right"><div class="src">수주월 / 금액(億)</div><div style="margin-top:2px;display:flex;gap:6px;align-items:center;justify-content:flex-end">${f('month',p.month,64,'11월')} ${cardAmtVal(p)!=null?`<b style="font-size:15px" title="T/A리스트 금액 합계(예정+수주완료)">${f1(p.amt)}</b>`:f('amt',p.amt,84,'수주액')} </div><div class="src" style="margin-top:4px">담당 ${f('owner',p.owner,150,'그룹 담당자')}</div></div></div>`;
 h+=`<div class="cgrid"><div><table class="info"><tbody>${p.info.map(([l,v],i)=>`<tr><th>${esc(l)}</th><td>${(/^수주예상/.test(l)&&cardAmtVal(p)!=null)?`<b>${f1(p.amt)}億원</b> <span class="src">T/A리스트 금액 합계(예정+수주완료 ${memberTA(p.key).filter(counted).length}건)와 자동 연동</span>`:RO?(l==='심의 일정'?schedHtml(v):nl2(v))||'-':`<textarea class="cell ta" rows="${rowsFor(v)}" data-k="info" data-id="${p.key}" data-i="${i}">${esc(v)}</textarea>`}</td></tr>`).join('')}</tbody></table></div>

 const pr=priorEntry(p.key,e,S.pdate),hd=progHead();
 const ed=(f,v)=>RO?(nl2(v)||'-'):`<textarea class="cell ta" rows="${rowsFor(v)}" data-k="log" data-id="${p.key}" data-f="${f}">${esc(v)}</textarea>`;
 h+=`<h3>진행경과 <span class="src">기준일 <select id="selPdate" style="font-size:12px">${logDates().map(d=>`<option ${d===S.pdate?'selected':''}>${d}</option>`).join('')}</select>${old?` · 이 기준일 입력 전, ${fmtD(e.date)} 내용 표시 중${RO?'':' (수정하면 이 기준일로 저장)'}`:''} · 주요 프로젝트 진행경과 탭과 같은 내용입니다</span></h3>

 <table class="info" style="margin-top:8px"><tbody><tr><th>수주전략</th><td>${ed('p2',e?e.p2||'':'')}</td></tr><tr><th>기타사항</th><td>${ed('p4',e?e.p4||'':'')}</td></tr></tbody></table>`;
 if(!RO)h+=`<div style="margin-top:14px;text-align:right"><button class="btn" data-act="delpjt">이 프로젝트 카드 삭제</button></div>`;
 return h}

 else if(act==='save')await save();
 else if(act==='openfile')await openFile();
 else if(act==='snap'){const d=todayISO();const lab=await ask(`현재 값을 '${d} 주간 마감' 스냅샷으로 저장할까요?\n이후 '전주比'가 이 시점과의 비교로 계산됩니다.`,[{t:'취소',v:null},{t:'마감 저장',v:d,pri:true}]);if(!lab)return;const snap={date:d,label:d.slice(5).replace('-','/')+' 마감',ta:D.ta.map(x=>({uid:x.uid,month:x.month,amt:x.amt,status:x.status,team:x.team,group:x.group}))};const i=D.snaps.findIndex(s=>s.date===d);if(i>=0)D.snaps[i]=snap;else D.snaps.push(snap);S.base=null;markDirty();render();toast('주간 마감 스냅샷이 저장되었습니다. 이어서 [저장]을 눌러 주세요')}
 else if(act==='exportview')exportView();
});
function setView(v){S.qmap=S.qmap||{};S.qmap[S.view]=S.q;S.view=v;S.q=S.qmap[v]||''}
let _qt=null,_comp=false;
function doSearch(){const el=document.activeElement;const t=(el&&el.classList&&el.classList.contains('qs'))?el:document.querySelector('.qs');if(!t)return;S.q=t.value;if(S.view==='card'){$('#pjList').innerHTML=cardListHtml();return}const a=t.selectionStart,b=t.selectionEnd;render();const q=document.querySelector('.qs');if(q){q.focus();try{q.setSelectionRange(a,b)}catch(e){}}}
function syncQx(){document.querySelectorAll('.qw').forEach(w=>{const b=w.querySelector('.qx');if(S.q&&!b){const x=document.createElement('button');x.className='qx';x.dataset.act='qclear';x.title='검색어 지우기';x.textContent='✕';w.appendChild(x)}else if(!S.q&&b)b.remove()})}
function applySearch(t){S.q=t.value;syncQx();clearTimeout(_qt);_qt=setTimeout(()=>{if(_comp)return;doSearch()},250)}
document.addEventListener('compositionstart',e=>{if(e.target.classList&&e.target.classList.contains('qs'))_comp=true});
document.addEventListener('input',e=>{const t=e.target;if(t.classList&&t.classList.contains('qs'))applySearch(t)});
document.addEventListener('compositionend',e=>{const t=e.target;if(t.classList&&t.classList.contains('qs')){_comp=false;applySearch(t)}});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id==='photoIn'){const f=t.files[0];t.value='';if(!f)return;const img=new Image();const rd=new FileReader();rd.onload=()=>{img.onload=()=>{const sc=Math.min(1,520/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const p=D.pjt.find(x=>x.key===S.sel);if(p){p.photo=c.toDataURL('image/jpeg',0.72);markDirty();$('#pjCard').innerHTML=cardHtml()}};img.src=rd.result};rd.readAsDataURL(f);return}
 if(t.id==='fileIn'){const f=t.files[0];t.value='';if(!f)return;try{const inc=await parseWorkbook(await f.arrayBuffer());let mode='replace';if(D.ta.length){mode=await ask(`엑셀에서 T/A ${inc.ta.length}건, 계획 ${inc.plan.length}건, 실적 ${inc.actual.length}건을 읽었습니다.\n\n병합: 기존 건은 금액만 갱신하고 ★연결·상태·일정은 유지, 새 건은 추가\n교체: 기존 T/A 데이터를 모두 엑셀 내용으로 바꿈 (★ 연결 초기화)`,[{t:'취소',v:null},{t:'교체',v:'replace'},{t:'병합',v:'merge',pri:true}]);if(!mode)return}
   applyImport(inc,mode);D.meta.asofLabel=`T/A리스트: 엑셀 업로드(${f.name}) · 프로젝트 카드: 기존 유지`;D.meta.asof=todayISO();markDirty();render();toast(`업로드 완료: T/A ${D.ta.length}건`)}catch(err){console.error(err);await ask('엑셀을 읽지 못했습니다.\n'+err.message,[{t:'확인',v:1,pri:true}])}return}
 if(t.id==='selBase'){S.base=+t.value;render();return}
 if(t.id==='selTrack'){S.trackMonth=t.value;render();return}
 if(t.id==='selPdate'){S.pdate=t.value;render();return}
 if(t.id==='selTaset'){syncTA();useTASet(t.value);render();return}
 if(t.dataset.pall){const q=S.q.trim().toLowerCase();cardSorted().filter(p=>(!S.pteam||p.team===S.pteam)&&(!S.pmon||p.month===S.pmon)&&cardMatch(p,q)).forEach(p=>p.print=t.checked);markDirty();render();return}
 if(t.dataset.flt){const f=t.dataset.flt;S[f]=t.type==='checkbox'?t.checked:t.value;if(f==='team')S.group='';render();return}
 const k=t.dataset.k;if(!k)return;const id=t.dataset.id,f=t.dataset.f,v=t.value;
 if(k==='ta'){const x=D.ta.find(r=>r.uid===id);if(!x)return;x[f]=(f==='amt'||f==='prev'||f==='aamt')?num(v):v;if(f==='team')x.group=groupsOf(v)[0];
  const done=()=>{if(x.status==='예정')x.status='수주완료'};
  if(f==='status'&&v==='수주완료'){if(!x.adate)x.adate=todayISO();if(!num(x.aamt))x.aamt=num(x.amt);toast('수주일자·수주금액이 자동 입력되었습니다. 실제 값으로 수정해 주세요')}
  if(f==='adate'&&v){done();if(!num(x.aamt))x.aamt=num(x.amt)}
  if(f==='aamt'&&num(v)>0){done();if(!x.adate)x.adate=todayISO()}
  markDirty();
  if(['team','pjt','status','month','adate','aamt'].includes(f))render();else updateListSums()}
 else if(k==='card'){const p=D.pjt.find(r=>r.key===id);if(!p)return;p[f]=v;markDirty();$('#pjList').innerHTML=cardListHtml();if(f==='flag'||f==='name')$('#pjCard').innerHTML=cardHtml()}
 else if(k==='print'){const p=D.pjt.find(r=>r.key===id);if(p){p.print=t.checked;markDirty();render()}}
 else if(k==='info'){const p=D.pjt.find(r=>r.key===id);if(!p)return;p.info[+t.dataset.i][1]=v;markDirty()}
 else if(k==='log'){const en=ensureEntry(id,S.pdate);en[f]=v;en.by=getName();markDirty();const pn=t.closest('td')&&t.closest('td').querySelector('.pn');if(pn)pn.remove()}
});

function getName(){try{return localStorage.getItem('siName')||''}catch(e){return ''}}
function setName(n){try{localStorage.setItem('siName',n)}catch(e){}}
/* ====================== 저장 / 열기 / 열람용 내보내기 ====================== */
async function save(){
 let name=getName();if(!name){name=prompt('작성자 이름 (저장 기록에 남습니다)')||'';setName(name)}
 const stamp=()=>{syncTA();D.meta.rev=(loadedRev||0)+1;D.meta.savedAt=new Date().toISOString().slice(0,19);D.meta.savedBy=name};
 if(!window.showSaveFilePicker){stamp();download(new Blob([JSON.stringify(D)],{type:'application/json'}),`si_data_${ymd()}.json`);loadedRev=D.meta.rev;dirty=false;toast('이 브라우저는 폴더 저장을 지원하지 않아 파일로 내려받았습니다');render();return}
 try{if(!fh)fh=await showSaveFilePicker({suggestedName:'si_data.json',types:[{description:'SI 수주 데이터',accept:{'application/json':['.json']}}]});
  else{const cur=JSON.parse(await(await fh.getFile()).text());if((cur.meta&&cur.meta.rev||0)!==loadedRev){const c=await ask(`다른 담당자가 먼저 저장했습니다.\n(파일 rev ${cur.meta&&cur.meta.rev}, 내가 연 rev ${loadedRev}, 저장자: ${cur.meta&&cur.meta.savedBy||'-'})\n\n덮어쓰면 상대방 수정이 사라집니다.`,[{t:'취소',v:'no'},{t:'다른 이름으로 내려받기',v:'dl'},{t:'덮어쓰기',v:'ow',pri:true}]);if(c==='no')return;if(c==='dl'){stamp();download(new Blob([JSON.stringify(D)],{type:'application/json'}),`si_data_${ymd()}_내수정.json`);return}}}
  stamp();const w=await fh.createWritable();await w.write(JSON.stringify(D));await w.close();loadedRev=D.meta.rev;dirty=false;render();toast('공유폴더에 저장했습니다')}
 catch(err){if(err.name!=='AbortError'){console.error(err);toast('저장 실패: '+err.message)}}}
async function openFile(){
 if(!window.showOpenFilePicker){await ask('이 브라우저는 파일 열기를 지원하지 않습니다.\nChrome 또는 Edge에서 열어주세요.',[{t:'확인',v:1,pri:true}]);return}
 try{const[h]=await showOpenFilePicker({types:[{description:'SI 수주 데이터',accept:{'application/json':['.json']}}]});const d=JSON.parse(await(await h.getFile()).text());if(!d.ta||!d.meta)throw new Error('데이터 파일 형식이 아닙니다');
  if(dirty&&!(await ask('저장하지 않은 수정이 있습니다. 열면 사라집니다.',[{t:'취소',v:0},{t:'열기',v:1,pri:true}])))return;
  D=d;fh=h;loadedRev=D.meta.rev||1;dirty=false;S.sel=null;S.base=null;render();toast(`불러옴: rev ${D.meta.rev}`)}catch(err){if(err.name!=='AbortError'){console.error(err);toast('열기 실패: '+err.message)}}}
function exportView(){const clone=document.documentElement.cloneNode(true);clone.querySelector('meta[name=mode]').setAttribute('content','view');clone.querySelector('#app').innerHTML='';clone.querySelector('#modal').innerHTML='';const t=clone.querySelector('#toast');t.className='';t.textContent='';
 clone.querySelector('#data').textContent=(syncTA(),JSON.stringify(D)).replace(/<\//g,'<\\/');
 download(new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html'}),`SI수주Live_열람용_${ymd()}.html`);toast('열람용 파일(수정 기능 없음)을 내려받았습니다')}
render();
</script>
